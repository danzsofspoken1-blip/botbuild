name: Web2Apk Build

on:
  workflow_dispatch:
    inputs:
      web_url:
        description: "URL website yang mau dibungkus jadi APK"
        required: true
      app_name:
        description: "Nama aplikasi (ditampilkan sebagai label APK)"
        required: true
      icon_url:
        description: "URL gambar icon.png (GitHub Release asset)"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: "stable"
          cache: true

      - name: Siapkan nama project yang valid
        id: meta
        run: |
          RAW_NAME="${{ github.event.inputs.app_name }}"
          PKG=$(echo "$RAW_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/_/g' | sed 's/_\+/_/g' | sed 's/^_//;s/_$//')
          if [ -z "$PKG" ] || ! [[ "$PKG" =~ ^[a-z] ]]; then
            PKG="app_${PKG}"
          fi
          echo "pkg=$PKG" >> "$GITHUB_OUTPUT"

      - name: Buat skeleton Flutter WebView project
        run: |
          flutter create --org com.web2apk --project-name "${{ steps.meta.outputs.pkg }}" webapp
          cd webapp
          flutter pub add webview_flutter
          flutter pub add -d flutter_launcher_icons

      - name: Tulis main.dart (WebView wrapper)
        run: |
          cat > webapp/lib/main.dart << 'DARTEOF'
          import 'package:flutter/material.dart';
          import 'package:webview_flutter/webview_flutter.dart';

          void main() => runApp(const Web2ApkApp());

          class Web2ApkApp extends StatelessWidget {
            const Web2ApkApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                theme: ThemeData(useMaterial3: true, colorSchemeSeed: Colors.blue),
                home: const WebViewScreen(),
              );
            }
          }

          class WebViewScreen extends StatefulWidget {
            const WebViewScreen({super.key});

            @override
            State<WebViewScreen> createState() => _WebViewScreenState();
          }

          class _WebViewScreenState extends State<WebViewScreen> {
            late final WebViewController _controller;
            bool _loading = true;

            @override
            void initState() {
              super.initState();
              _controller = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..setNavigationDelegate(
                  NavigationDelegate(
                    onPageStarted: (_) => setState(() => _loading = true),
                    onPageFinished: (_) => setState(() => _loading = false),
                  ),
                )
                ..loadRequest(Uri.parse('WEB2APK_TARGET_URL'));
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: SafeArea(
                  child: Stack(
                    children: [
                      WebViewWidget(controller: _controller),
                      if (_loading) const Center(child: CircularProgressIndicator()),
                    ],
                  ),
                ),
              );
            }
          }
          DARTEOF
          sed -i "s#WEB2APK_TARGET_URL#${{ github.event.inputs.web_url }}#" webapp/lib/main.dart

      - name: Pasang izin INTERNET di AndroidManifest
        run: |
          MANIFEST="webapp/android/app/src/main/AndroidManifest.xml"
          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i '0,/<application/s##<uses-permission android:name="android.permission.INTERNET"\/>\n    <application#' "$MANIFEST"
          fi

      - name: Set nama aplikasi (label) di AndroidManifest
        run: |
          MANIFEST="webapp/android/app/src/main/AndroidManifest.xml"
          sed -i "s#android:label=\"[^\"]*\"#android:label=\"${{ github.event.inputs.app_name }}\"#" "$MANIFEST"

      - name: Download icon dan siapkan flutter_launcher_icons
        run: |
          mkdir -p webapp/assets/icon
          curl -L \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "${{ github.event.inputs.icon_url }}" -o webapp/assets/icon/icon.png

          cat >> webapp/pubspec.yaml << 'YMLEOF'

          flutter_launcher_icons:
            android: true
            ios: false
            image_path: "assets/icon/icon.png"
          YMLEOF

      - name: Flutter pub get
        working-directory: webapp
        run: flutter pub get

      - name: Generate launcher icons
        working-directory: webapp
        run: dart run flutter_launcher_icons

      - name: Flutter analyze (diagnostic, tidak menggagalkan build)
        working-directory: webapp
        continue-on-error: true
        run: |
          echo "[RESULT_ANALYZE]"
          flutter analyze || true
          echo "[END_RESULT_ANALYZE]"

      - name: Build APK (release)
        working-directory: webapp
        run: flutter build apk --release

      - name: Kumpulkan APK hasil build
        run: |
          mkdir -p output
          find webapp/build/app/outputs -name "*.apk" -exec cp {} output/ \;
          ls -la output

      - name: Upload artifact APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-build-web2apk-${{ github.run_id }}
          path: output/*.apk
          retention-days: 3
