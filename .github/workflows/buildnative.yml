name: Build Native APK (Server 2)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      flutter_arch:
        description: 'Flutter architecture'
        required: true
        default: 'arm64-v8a'
        type: choice
        options:
          - arm64-v8a
          - armeabi-v7a
          - x86_64
          - all

jobs:
  build-native:
    runs-on: ubuntu-latest
    
    outputs:
      apk_path: ${{ steps.set-output.outputs.apk_path }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Accept Android SDK licenses
      run: |
        yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses

    - name: Grant execute permission for gradlew
      run: chmod +x apk_korban/gradlew

    - name: Build Native APK (Release)
      if: github.event.inputs.build_type == 'release' || github.event_name == 'push' || github.event_name == 'pull_request'
      run: |
        cd apk_korban
        ./gradlew assembleRelease

    - name: Build Native APK (Debug)
      if: github.event.inputs.build_type == 'debug'
      run: |
        cd apk_korban
        ./gradlew assembleDebug

    - name: Set output path
      id: set-output
      run: |
        if [ "${{ github.event.inputs.build_type }}" == "debug" ]; then
          echo "apk_path=apk_korban/app/build/outputs/apk/debug/app-debug.apk" >> $GITHUB_OUTPUT
        else
          echo "apk_path=apk_korban/app/build/outputs/apk/release/app-release.apk" >> $GITHUB_OUTPUT
        fi

    - name: Upload Native APK
      uses: actions/upload-artifact@v4
      with:
        name: native-apk-${{ github.event.inputs.build_type || 'release' }}
        path: ${{ steps.set-output.outputs.apk_path }}

    - name: Upload Native APK (Debug)
      if: github.event.inputs.build_type == 'debug'
      uses: actions/upload-artifact@v4
      with:
        name: native-apk-debug
        path: apk_korban/app/build/outputs/apk/debug/app-debug.apk

    - name: Upload Native APK (Release)
      if: github.event.inputs.build_type == 'release' || github.event_name == 'push' || github.event_name == 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: native-apk-release
        path: apk_korban/app/build/outputs/apk/release/app-release.apk

  # ─── UPLOAD TO RELEASE ────────────────────────────────────
  upload-release:
    needs: build-native
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    
    steps:
    - name: Download Native APK
      uses: actions/download-artifact@v4
      with:
        name: native-apk-${{ github.event.inputs.build_type || 'release' }}
        path: ./apk

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: native-build-${{ github.run_number }}
        name: Native Build ${{ github.run_number }}
        draft: false
        prerelease: true
        generate_release_notes: true
        files: |
          ./apk/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Output Release URL
      run: |
        echo "Release URL: ${{ steps.create_release.outputs.url }}"
        echo "Upload URL: ${{ steps.create_release.outputs.upload_url }}"
