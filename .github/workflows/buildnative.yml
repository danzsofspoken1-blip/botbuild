name: Build Native Android APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL download ZIP project Android Native"
        required: true
        type: string
      tag:
        description: "Tag build (unik per user/job)"
        required: true
        type: string
      build_type:
        description: "debug atau release"
        required: true
        type: string
        default: "release"

env:
  TAG: ${{ inputs.tag }}
  BUILD_TYPE: ${{ inputs.build_type }}
  ZIP_URL: ${{ inputs.zip_url }}

jobs:
  build:
    name: Native Build (${{ inputs.build_type }})
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create workdir
        run: |
          mkdir -p "$GITHUB_WORKSPACE/project" "$GITHUB_WORKSPACE/out" "$GITHUB_WORKSPACE/logs"
          echo "TAG=${{ inputs.tag }}" > "$GITHUB_WORKSPACE/logs/build_meta.txt"
          echo "BUILD_TYPE=${{ inputs.build_type }}" >> "$GITHUB_WORKSPACE/logs/build_meta.txt"
          echo "PLATFORM=native" >> "$GITHUB_WORKSPACE/logs/build_meta.txt"
          echo "STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_WORKSPACE/logs/build_meta.txt"

      - name: Download project ZIP
        id: download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          LOG="$GITHUB_WORKSPACE/logs/build_error.log"
          ZIP_OUT="$GITHUB_WORKSPACE/project.zip"
          URL="${{ inputs.zip_url }}"
          {
            echo "========== DOWNLOAD ZIP =========="
            echo "URL: $URL"
            echo "TAG: ${{ inputs.tag }}"
            echo "TIME: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
          } | tee -a "$LOG"

          download_ok=0
          for i in 1 2 3 4; do
            echo "Download attempt $i (public)..." | tee -a "$LOG"
            if curl -L --fail --retry 2 --retry-delay 2 \
              -A "FlutterBuildBot/1.0" \
              -o "$ZIP_OUT" \
              "$URL" 2>>"$LOG"; then
              download_ok=1
              break
            fi
            echo "Attempt $i failed, sleep 3s..." | tee -a "$LOG"
            sleep 3
          done

          if [ "$download_ok" -ne 1 ]; then
            echo "Public download gagal. Coba via GitHub API + GITHUB_TOKEN..." | tee -a "$LOG"
            if echo "$URL" | grep -qE 'github.com/.+/releases/download/'; then
              OWNER_REPO=$(echo "$URL" | sed -E 's|https://github.com/([^/]+/[^/]+)/releases/download/.*|\1|')
              TAG_PART=$(echo "$URL" | sed -E 's|https://github.com/[^/]+/[^/]+/releases/download/([^/]+)/.*|\1|')
              FILE_PART=$(echo "$URL" | sed -E 's|https://github.com/[^/]+/[^/]+/releases/download/[^/]+/(.*)|\1|')
              TAG_DEC=$(python3 -c "import urllib.parse,sys; print(urllib.parse.unquote(sys.argv[1]))" "$TAG_PART")
              FILE_DEC=$(python3 -c "import urllib.parse,sys; print(urllib.parse.unquote(sys.argv[1]))" "$FILE_PART")
              echo "owner/repo=$OWNER_REPO tag=$TAG_DEC file=$FILE_DEC" | tee -a "$LOG"
              printf '%s' "$FILE_DEC" > /tmp/want_name.txt
              API="https://api.github.com/repos/${OWNER_REPO}/releases/tags/${TAG_DEC}"
              curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$API" -o /tmp/rel.json 2>>"$LOG" || true
              ASSET_ID=$(python3 -c "import json; d=json.load(open('/tmp/rel.json')); want=open('/tmp/want_name.txt').read().strip(); assets=d.get('assets') or []; m=next((a for a in assets if a.get('name')==want), None) or next((a for a in assets if str(a.get('name','')).lower().endswith('.zip')), None); print(m['id'] if m else '')")
              if [ -n "$ASSET_ID" ]; then
                echo "Found asset id: $ASSET_ID" | tee -a "$LOG"
                if curl -L --fail \
                  -H "Authorization: Bearer $GH_TOKEN" \
                  -H "Accept: application/octet-stream" \
                  -o "$ZIP_OUT" \
                  "https://api.github.com/repos/${OWNER_REPO}/releases/assets/${ASSET_ID}" 2>>"$LOG"; then
                  download_ok=1
                fi
              else
                echo "Asset id tidak ditemukan di release tag $TAG_DEC" | tee -a "$LOG"
                head -c 800 /tmp/rel.json | tee -a "$LOG" || true
              fi
            fi
          fi

          if [ "$download_ok" -ne 1 ]; then
            echo "ERROR: Gagal download ZIP dari URL yang diberikan (404/unauthorized)." | tee -a "$LOG"
            exit 1
          fi

          FILE_SIZE=$(stat -c%s "$ZIP_OUT" 2>/dev/null || echo 0)
          echo "Downloaded size: ${FILE_SIZE} bytes" | tee -a "$LOG"
          if [ "$FILE_SIZE" -lt 100 ]; then
            echo "ERROR: File ZIP kosong atau terlalu kecil." | tee -a "$LOG"
            exit 1
          fi

      - name: Extract & locate Android project
        id: extract
        run: |
          set -e
          LOG="$GITHUB_WORKSPACE/logs/build_error.log"
          {
            echo ""
            echo "========== EXTRACT ZIP =========="
          } | tee -a "$LOG"

          unzip -q -o "$GITHUB_WORKSPACE/project.zip" -d "$GITHUB_WORKSPACE/project" 2>>"$LOG" || {
            echo "ERROR: Gagal extract ZIP. Pastikan file valid (.zip)." | tee -a "$LOG"
            exit 1
          }

          # Deteksi Flutter project (ada pubspec.yaml) — folder android/ adalah subproject
          PUBSPEC=$(find "$GITHUB_WORKSPACE/project" -maxdepth 4 -type f -name "pubspec.yaml" | head -n 1)
          if [ -n "$PUBSPEC" ]; then
            FLUTTER_ROOT=$(dirname "$PUBSPEC")
            echo "WARNING: ZIP ini terlihat seperti project FLUTTER (ada pubspec.yaml)." | tee -a "$LOG"
            echo "Native workflow akan build folder android/ saja. Untuk full Flutter APK, pilih Flutter Build." | tee -a "$LOG"
            if [ -d "$FLUTTER_ROOT/android" ]; then
              PROJECT_DIR="$FLUTTER_ROOT/android"
            else
              PROJECT_DIR=""
            fi
          else
            PROJECT_DIR=""
          fi

          if [ -z "$PROJECT_DIR" ]; then
            SETTINGS=$(find "$GITHUB_WORKSPACE/project" -maxdepth 5 -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)
            if [ -n "$SETTINGS" ]; then
              PROJECT_DIR=$(dirname "$SETTINGS")
            else
              ROOT_GRADLE=$(find "$GITHUB_WORKSPACE/project" -maxdepth 5 -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) | head -n 1)
              if [ -z "$ROOT_GRADLE" ]; then
                echo "ERROR: settings.gradle / build.gradle tidak ditemukan di dalam ZIP." | tee -a "$LOG"
                echo "Struktur folder:" | tee -a "$LOG"
                find "$GITHUB_WORKSPACE/project" -maxdepth 3 -type d 2>/dev/null | head -50 | tee -a "$LOG"
                exit 1
              fi
              PROJECT_DIR=$(dirname "$ROOT_GRADLE")
            fi
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project root: $PROJECT_DIR" | tee -a "$LOG"
          ls -la "$PROJECT_DIR" | tee -a "$LOG"

          # local.properties wajib untuk Android SDK path
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "sdk.dir=$SDK_DIR" > "$PROJECT_DIR/local.properties"
          echo "Wrote local.properties -> sdk.dir=$SDK_DIR" | tee -a "$LOG"

          if [ -f "$PROJECT_DIR/gradlew" ]; then
            chmod +x "$PROJECT_DIR/gradlew"
          fi

      - name: Install Android SDK packages
        run: |
          LOG="$GITHUB_WORKSPACE/logs/build_error.log"
          {
            echo ""
            echo "========== ANDROID SDK PACKAGES =========="
          } | tee -a "$LOG"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          # Platform + build-tools umum
          sdkmanager "platform-tools" "platforms;android-34" "platforms;android-33" "build-tools;34.0.0" "build-tools;33.0.2" 2>&1 | tee -a "$LOG" || true

      - name: Prepare Gradle Wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          LOG="$GITHUB_WORKSPACE/logs/build_error.log"
          {
            echo ""
            echo "========== GRADLE WRAPPER =========="
          } | tee -a "$LOG"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "gradlew sudah ada" | tee -a "$LOG"
          else
            echo "gradlew tidak ada — generate wrapper..." | tee -a "$LOG"
            if ! command -v gradle >/dev/null 2>&1; then
              sudo apt-get update -qq
              sudo apt-get install -y -qq gradle 2>&1 | tee -a "$LOG"
            fi
            # Baca distributionUrl dari gradle/wrapper jika ada, else default
            gradle wrapper --gradle-version 8.7 2>&1 | tee -a "$LOG" || {
              echo "WARNING: gradle wrapper gagal, akan coba gradle system" | tee -a "$LOG"
            }
            if [ -f "./gradlew" ]; then
              chmod +x ./gradlew
            fi
          fi

      - name: Gradle build
        id: build
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          LOG="$GITHUB_WORKSPACE/logs/build_error.log"
          TYPE="${{ inputs.build_type }}"
          {
            echo ""
            echo "========== NATIVE GRADLE BUILD ($TYPE) =========="
            echo "TIME: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "PWD: $(pwd)"
            echo "Java: $(java -version 2>&1 | head -1)"
          } | tee -a "$LOG"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            GRADLE="./gradlew"
          else
            GRADLE="gradle"
          fi
          echo "Using: $GRADLE" | tee -a "$LOG"

          # List tasks (debug) — jangan gagalkan
          set +e
          $GRADLE tasks --all 2>&1 | grep -iE 'assemble|build' | head -40 | tee -a "$LOG"
          set -e

          # Pilih task
          if [ "$TYPE" = "debug" ]; then
            TASKS="assembleDebug"
          else
            # release sering butuh signing → coba release dulu, fallback debug
            TASKS="assembleRelease"
          fi

          run_build() {
            local task="$1"
            echo "" | tee -a "$LOG"
            echo ">>> Running: $GRADLE $task --stacktrace --no-daemon" | tee -a "$LOG"
            set +e
            $GRADLE "$task" --stacktrace --no-daemon 2>&1 | tee -a "$LOG"
            local ec=${PIPESTATUS[0]}
            set -e
            return $ec
          }

          BUILD_EXIT=1
          if run_build "$TASKS"; then
            BUILD_EXIT=0
          else
            BUILD_EXIT=$?
            echo "ERROR: Task $TASKS gagal (exit $BUILD_EXIT)." | tee -a "$LOG"

            # Fallback 1: assembleDebug
            if [ "$TASKS" != "assembleDebug" ]; then
              echo "Fallback → assembleDebug ..." | tee -a "$LOG"
              if run_build "assembleDebug"; then
                BUILD_EXIT=0
              else
                BUILD_EXIT=$?
              fi
            fi

            # Fallback 2: assemble (generic)
            if [ "$BUILD_EXIT" -ne 0 ]; then
              echo "Fallback → assemble ..." | tee -a "$LOG"
              if run_build "assemble"; then
                BUILD_EXIT=0
              else
                BUILD_EXIT=$?
              fi
            fi
          fi

          if [ "$BUILD_EXIT" -ne 0 ]; then
            {
              echo ""
              echo "========== GRADLE FAILURE SUMMARY =========="
              echo "Exit code: $BUILD_EXIT"
              echo "--- grep error/FAILURE dari log ---"
              grep -iE 'error:|FAILURE:|What went wrong|Could not|not found|FAILED' "$LOG" | tail -40 || true
              echo "--- isi settings/build.gradle (head) ---"
              head -40 settings.gradle settings.gradle.kts 2>/dev/null || true
              head -40 build.gradle build.gradle.kts 2>/dev/null || true
              echo "ERROR: Build Android Native gagal."
            } | tee -a "$LOG"
            exit 1
          fi

          # Cari APK
          APK_SRC=$(find . -type f -path "*/outputs/apk/*/*.apk" 2>/dev/null | head -n 1)
          if [ -z "$APK_SRC" ]; then
            APK_SRC=$(find . -type f -name "*.apk" ! -path "*/.gradle/*" 2>/dev/null | head -n 1)
          fi

          if [ -z "$APK_SRC" ] || [ ! -f "$APK_SRC" ]; then
            echo "ERROR: APK tidak ditemukan setelah build." | tee -a "$LOG"
            find . -type f -name "*.apk" 2>/dev/null | tee -a "$LOG" || true
            find . -type d -name "outputs" 2>/dev/null | head -20 | tee -a "$LOG" || true
            exit 1
          fi

          OUT_NAME="app-${TYPE}-${{ inputs.tag }}.apk"
          cp "$APK_SRC" "$GITHUB_WORKSPACE/out/$OUT_NAME"
          ls -lh "$GITHUB_WORKSPACE/out/$OUT_NAME" | tee -a "$LOG"
          echo "Build sukses: $OUT_NAME" | tee -a "$LOG"

      - name: Write success log
        if: success()
        run: |
          LOG="$GITHUB_WORKSPACE/logs/build_error.log"
          {
            echo ""
            echo "========== BUILD SUCCESS =========="
            echo "TAG: ${{ inputs.tag }}"
            echo "PLATFORM: native"
            echo "BUILD_TYPE: ${{ inputs.build_type }}"
            echo "FINISHED_AT: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee -a "$LOG"
          cp "$LOG" "$GITHUB_WORKSPACE/out/build_log_${{ inputs.tag }}.txt"

      - name: Capture failure log
        if: failure()
        run: |
          LOG="$GITHUB_WORKSPACE/logs/build_error.log"
          {
            echo ""
            echo "========== BUILD FAILED =========="
            echo "TAG: ${{ inputs.tag }}"
            echo "PLATFORM: native"
            echo "BUILD_TYPE: ${{ inputs.build_type }}"
            echo "FAILED_AT: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo "--- last 120 lines of log ---"
            tail -120 "$LOG" || true
          } | tee -a "$LOG"
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp "$LOG" "$GITHUB_WORKSPACE/out/build_error_${{ inputs.tag }}.log"
          cp "$LOG" "$GITHUB_WORKSPACE/out/build_log_${{ inputs.tag }}.txt"

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.tag }}
          path: ${{ github.workspace }}/out/*.apk
          if-no-files-found: error
          retention-days: 3

      - name: Upload build log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ inputs.tag }}
          path: |
            ${{ github.workspace }}/out/build_log_*.txt
            ${{ github.workspace }}/out/build_error_*.log
            ${{ github.workspace }}/logs/build_error.log
          if-no-files-found: ignore
          retention-days: 7
