name: Build APK Korban (Java Native)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Accept Android SDK licenses
      run: |
        yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses

    - name: Grant execute permission for gradlew
      run: chmod +x apk_korban/gradlew

    - name: Build APK with Gradle
      run: |
        cd apk_korban
        ./gradlew assembleRelease

    - name: Upload APK Release
      uses: actions/upload-artifact@v4
      with:
        name: apk-korban-release
        path: apk_korban/app/build/outputs/apk/release/app-release.apk

    - name: Upload APK Debug
      uses: actions/upload-artifact@v4
      with:
        name: apk-korban-debug
        path: apk_korban/app/build/outputs/apk/debug/app-debug.apk
