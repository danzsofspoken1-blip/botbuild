name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL asset zip project Flutter (GitHub Release)"
        required: true
      tag:
        description: "Tag build (dipakai untuk nama artifact)"
        required: true
      build_type:
        description: "release atau debug"
        required: false
        default: "release"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: "stable"
          cache: true

      - name: Download project zip
        run: |
          curl -L \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "${{ github.event.inputs.zip_url }}" -o project.zip
          mkdir -p project
          unzip -q project.zip -d project

      - name: Detect project root (cari pubspec.yaml)
        id: rootdir
        run: |
          if [ -f "project/pubspec.yaml" ]; then
            echo "root=project" >> "$GITHUB_OUTPUT"
          else
            SUBDIR=$(find project -maxdepth 4 -name "pubspec.yaml" -printf '%h\n' | head -n1)
            if [ -z "$SUBDIR" ]; then
              echo "::error::pubspec.yaml tidak ditemukan di dalam zip!"
              exit 1
            fi
            echo "root=$SUBDIR" >> "$GITHUB_OUTPUT"
          fi

      - name: Flutter pub get
        working-directory: ${{ steps.rootdir.outputs.root }}
        run: flutter pub get

      - name: Flutter analyze (diagnostic, tidak menggagalkan build)
        working-directory: ${{ steps.rootdir.outputs.root }}
        continue-on-error: true
        run: |
          echo "[RESULT_ANALYZE]"
          flutter analyze || true
          echo "[END_RESULT_ANALYZE]"

      - name: Build APK (release)
        if: ${{ github.event.inputs.build_type != 'debug' }}
        working-directory: ${{ steps.rootdir.outputs.root }}
        run: flutter build apk --release

      - name: Build APK (debug)
        if: ${{ github.event.inputs.build_type == 'debug' }}
        working-directory: ${{ steps.rootdir.outputs.root }}
        run: flutter build apk --debug

      - name: Kumpulkan APK hasil build
        run: |
          mkdir -p output
          find "${{ steps.rootdir.outputs.root }}/build/app/outputs" -name "*.apk" -exec cp {} output/ \;
          ls -la output

      - name: Upload artifact APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-build-${{ github.event.inputs.tag }}
          path: output/*.apk
          retention-days: 3
          if-no-files-found: error
